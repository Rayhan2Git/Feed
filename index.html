<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DesiFlix Pro</title>
<style>
/* ═══════════════════════════════════════
   THEME & UI (From your original file)
═══════════════════════════════════════ */
:root {
  --red: #e50914;
  --bg: #000;
  --surface: #111;
  --card: #181818;
  --text: #fff;
  --muted: #999;
  --nav-h: 65px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; }

/* Splash Screen */
#splash { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
.cherry { font-size: 80px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* Layout */
#app { display: none; height: 100%; flex-direction: column; }
.page { display: none; height: calc(100% - var(--nav-h)); overflow-y: auto; padding-bottom: 20px; }
.active { display: block; }

/* Netflix Style Grid */
.section-title { padding: 20px 15px 10px; font-weight: bold; font-size: 18px; }
.movie-grid { display: flex; overflow-x: auto; gap: 10px; padding: 0 15px; scrollbar-width: none; }
.movie-grid::-webkit-scrollbar { display: none; }
.movie-card { min-width: 110px; background: var(--card); border-radius: 4px; overflow: hidden; }
.movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }

/* TikTok Vertical Scroll */
#scrollPage { background: #000; height: calc(100% - var(--nav-h)); overflow-y: scroll; snap-type: y mandatory; }
.v-video { height: 100%; width: 100%; snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #111; }
.v-video video { width: 100%; height: 100%; object-fit: cover; }

/* Navigation */
nav { height: var(--nav-h); background: rgba(0,0,0,0.9); display: flex; border-top: 1px solid #222; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 10px; cursor: pointer; }
.nav-item.active-tab { color: var(--red); }
.nav-item i { font-size: 20px; margin-bottom: 3px; font-style: normal; }

/* Player Overlay */
#playerOverlay { position: fixed; inset: 0; z-index: 10000; background: #000; display: none; }
.close-p { position: absolute; top: 30px; left: 20px; font-size: 30px; z-index: 10001; color: white; }
</style>
</head>
<body>

<div id="splash">
  <div class="cherry">🍒</div>
  <h1 style="color:var(--red); letter-spacing: 4px;">DESIFLIX</h1>
</div>

<div id="app">
  <main style="flex:1; overflow:hidden;">
    <section id="homePage" class="page active">
       <header style="padding: 20px; font-size: 24px; color: var(--red); font-weight: bold;">DESIFLIX</header>
       <div class="section-title">Trending Now</div>
       <div id="trendingGrid" class="movie-grid"></div>
       <div class="section-title">Recently Added</div>
       <div id="recentGrid" class="movie-grid"></div>
    </section>
    
    <section id="scrollPage" class="page"></section>

    <section id="profilePage" class="page">
      <div style="padding: 50px 20px; text-align: center;">
        <h2>Settings</h2>
        <p style="color:var(--muted); margin-top: 10px;">Web App Version 1.2.0</p>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-item active-tab" onclick="switchTab('home')"><i>🏠</i>Home</div>
    <div class="nav-item" onclick="switchTab('scroll')"><i>🎬</i>Scroll</div>
    <div class="nav-item" onclick="switchTab('profile')"><i>👤</i>Profile</div>
  </nav>
</div>

<div id="playerOverlay">
  <div class="close-p" onclick="closePlayer()">✕</div>
  <video id="mainPlayer" controls playsinline></video>
</div>

<script>
const CFG = {
  m3u: "https://raw.githubusercontent.com/Rayhan2Git/Feed/main/playlist.m3u",
  proxy: "https://feedscroll.rayhandox.workers.dev/?url="
};

// TAB SYSTEM
function switchTab(tabId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(tabId + 'Page').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active-tab'));
  event.currentTarget.classList.add('active-tab');
  
  // Pause videos if leaving scroll tab
  if(tabId !== 'scroll') {
      const vids = document.querySelectorAll('#scrollPage video');
      vids.forEach(v => v.pause());
  }
}

// PLAYER LOGIC
function openPlayer(url) {
  const v = document.getElementById('mainPlayer');
  v.src = CFG.proxy + encodeURIComponent(url);
  document.getElementById('playerOverlay').style.display = 'block';
  v.play();
}

function closePlayer() {
  const v = document.getElementById('mainPlayer');
  v.pause(); v.src = "";
  document.getElementById('playerOverlay').style.display = 'none';
}

// M3U PARSING & RENDERING
async function init() {
  try {
    const res = await fetch(CFG.m3u);
    const text = await res.text();
    const items = parseM3U(text);
    renderHome(items);
    renderScroll(items);
  } catch (e) { console.error("Load failed"); }

  // Hide Splash
  setTimeout(() => {
    document.getElementById('splash').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }, 500);
  }, 2000);
}

function parseM3U(data) {
  const items = [];
  const lines = data.split('\n');
  let current = {};
  lines.forEach(line => {
    if (line.startsWith('#EXTINF:')) {
      current.name = line.split(',')[1];
      const logo = line.match(/tvg-logo="([^"]+)"/);
      current.logo = logo ? logo[1] : '';
    } else if (line.startsWith('http')) {
      current.url = line.trim();
      items.push(current);
      current = {};
    }
  });
  return items;
}

function renderHome(items) {
  const trend = document.getElementById('trendingGrid');
  const recent = document.getElementById('recentGrid');
  items.forEach(item => {
    const card = `<div class="movie-card" onclick="openPlayer('${item.url}')">
      <img src="${item.logo}" alt="">
      <p style="font-size:10px; padding:5px; white-space:nowrap; overflow:hidden;">${item.name}</p>
    </div>`;
    trend.innerHTML += card;
    recent.innerHTML += card;
  });
}

function renderScroll(items) {
  const container = document.getElementById('scrollPage');
  items.forEach(item => {
    const section = document.createElement('div');
    section.className = 'v-video';
    section.innerHTML = `
      <video loop playsinline muted onclick="this.paused ? this.play() : this.pause()">
        <source src="${CFG.proxy + encodeURIComponent(item.url)}" type="video/mp4">
      </video>
      <div style="position:absolute; bottom:20px; left:15px; text-shadow:2px 2px 5px #000;">
        <b>${item.name}</b>
      </div>
    `;
    container.appendChild(section);
  });
}

init();
</script>
</body>
</html>
