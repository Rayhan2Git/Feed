<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>DesiFlix Pro 🍒</title>
<style>
/* ═══════════════════════════════════════
   THEME & RESET (Netflix Dark Mode)
═══════════════════════════════════════ */
:root {
  --red: #e50914;
  --bg: #000;
  --surface: #111;
  --card: #181818;
  --border: #2a2a2a;
  --text: #fff;
  --muted: #999;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --nav-h: 65px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: sans-serif; height: 100vh; overflow: hidden; }

/* ═══════════════════════════════════════
   SPLASH SCREEN
═══════════════════════════════════════ */
#splash {
  position: fixed; inset: 0; z-index: 9999; background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.6s ease;
}
.cherry { font-size: 80px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* ═══════════════════════════════════════
   LAYOUT
═══════════════════════════════════════ */
#app { display: none; height: 100%; flex-direction: column; }
.page { display: none; height: calc(100% - var(--nav-h)); overflow-y: auto; padding-bottom: 20px; }
.active { display: block; }

/* Bottom Nav */
nav {
  height: var(--nav-h); background: rgba(0,0,0,0.9);
  backdrop-filter: blur(10px); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  padding-bottom: var(--safe-bot);
}
.nav-item { color: var(--muted); text-align: center; font-size: 10px; flex: 1; }
.nav-item.active-tab { color: var(--red); }
.nav-item i { display: block; font-size: 24px; margin-bottom: 2px; }

/* Video Player Overlay */
#playerOverlay {
  position: fixed; inset: 0; z-index: 1000; background: #000; display: none;
}
video { width: 100%; height: 100%; object-fit: contain; }
.close-player { position: absolute; top: 30px; left: 20px; font-size: 30px; z-index: 1010; }
</style>
</head>
<body>

<div id="splash">
  <div class="cherry">🍒</div>
  <h1 style="color:var(--red); letter-spacing: 4px; margin-top:10px;">DESIFLIX</h1>
  <p id="splashVer" style="font-size:12px; color:var(--dim); margin-top:20px;">v1.0.0</p>
</div>

<div id="app">
  <header style="padding: 20px 20px 10px; display:flex; justify-content:space-between; align-items:center;">
    <span style="color:var(--red); font-weight:bold; font-size:24px;">🍒</span>
    <div id="searchBtn" style="font-size:20px;">🔍</div>
  </header>

  <main style="flex:1; overflow:hidden; position:relative;">
    <section id="homePage" class="page active">
       <div style="padding:20px; text-align:center; color:var(--muted);">Loading Feed...</div>
    </section>
    
    <section id="scrollPage" class="page">
      </section>

    <section id="profilePage" class="page">
      <div style="padding:40px 20px;">
        <h2>Settings</h2>
        <button onclick="checkForUpdates()" style="margin-top:20px; background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:4px;">Check for Update</button>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-item active-tab" onclick="switchTab('home')"><i>🏠</i>Home</div>
    <div class="nav-item" onclick="switchTab('scroll')"><i>🎬</i>Scroll</div>
    <div class="nav-item" onclick="switchTab('profile')"><i>👤</i>Profile</div>
  </nav>
</div>

<div id="playerOverlay">
  <div class="close-player" onclick="closePlayer()">✕</div>
  <video id="mainPlayer" controls autoplay playsinline></video>
</div>

<script src="https://unpkg.com/@capacitor/core@latest/dist/capacitor.js"></script>
<script>
// CONFIG
const CFG = {
  m3u: "https://raw.githubusercontent.com/Rayhan2Git/Feed/main/playlist.m3u",
  proxy: "https://feedscroll.rayhandox.workers.dev/?url=",
  version: "1.1.0"
};

// ════════════════════════════════════════
//  NATIVE ANDROID BACK BUTTON LOGIC
// ════════════════════════════════════════
if (window.Capacitor) {
  const { App } = Capacitor.Plugins;
  App.addListener('backButton', () => {
    if (document.getElementById('playerOverlay').style.display === 'block') {
      closePlayer();
    } else {
      // If on Home, exit app. If elsewhere, go Home.
      const homeActive = document.getElementById('homePage').classList.contains('active');
      if (homeActive) {
        App.exitApp();
      } else {
        switchTab('home');
      }
    }
  });
}

// ════════════════════════════════════════
//  APP LOGIC
// ════════════════════════════════════════
function switchTab(tabId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(tabId + 'Page').classList.add('active');
  
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active-tab'));
  event.currentTarget.classList.add('active-tab');
}

function openPlayer(url) {
  const video = document.getElementById('mainPlayer');
  video.src = CFG.proxy + encodeURIComponent(url);
  document.getElementById('playerOverlay').style.display = 'block';
}

function closePlayer() {
  const video = document.getElementById('mainPlayer');
  video.pause();
  video.src = "";
  document.getElementById('playerOverlay').style.display = 'none';
}

// INITIALIZE
window.onload = () => {
  // Splash hide
  setTimeout(() => {
    document.getElementById('splash').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }, 600);
  }, 2000);
  
  // Load M3U logic goes here...
};
</script>
</body>
</html>
