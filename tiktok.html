<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DesiTales Lite</title>
    <style>
        :root { --tiktok-red: #fe2c55; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        
        #feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        #feed::-webkit-scrollbar { display: none; }

        .video-card { 
            height: 100vh; width: 100vw; 
            scroll-snap-align: start; 
            position: relative; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        /* Removed Blur for better performance */
        video.main-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* Sidebar UI */
        .sidebar { position: absolute; right: 12px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10; }
        .pfp { width: 45px; height: 45px; border-radius: 50%; border: 2px solid white; background: #333; }
        
        .btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; font-size: 28px; }
        .btn span { font-size: 12px; margin-top: 4px; font-weight: bold; }

        /* Bottom Meta - Fixed Visibility */
        .meta { position: absolute; bottom: 40px; left: 15px; right: 80px; z-index: 10; pointer-events: none; }
        .handle { font-weight: bold; font-size: 18px; margin-bottom: 5px; color: #fff; text-shadow: 2px 2px 4px #000; }
        .desc { font-size: 15px; color: #eee; text-shadow: 2px 2px 4px #000; }

        /* Progress Bar */
        .progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.1); z-index: 15; }
        .progress-bar { height: 100%; background: var(--tiktok-red); width: 0%; }
        
        /* Loading Text */
        .loading-text { position: absolute; font-size: 14px; color: #555; z-index: 1; }
    </style>
</head>
<body>

<div id="feed"></div>

<script>
    const PROXY = "https://feedscroll.rayhandox.workers.dev/?url=";
    const M3U_PATH = "playlist.m3u"; 

    async function loadVideos() {
        const feed = document.getElementById('feed');
        try {
            const response = await fetch(M3U_PATH);
            const text = await response.text();
            const lines = text.split('\n');
            
            let currentTitle = "";

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    currentTitle = line.split(',')[1] || "Exclusive Video";
                } else if (line.startsWith('http')) {
                    const videoUrl = PROXY + encodeURIComponent(line);
                    const card = createVideoCard(videoUrl, currentTitle);
                    feed.appendChild(card);
                }
            });
            startObserver();
        } catch (e) {
            feed.innerHTML = `<div style="padding: 50px; text-align: center;">Error: Link M3U properly.</div>`;
        }
    }

    function createVideoCard(url, title) {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
            <div class="loading-text">Loading...</div>
            <video class="main-video" loop playsinline src="${url}"></video>
            
            <div class="sidebar">
                <img class="pfp" src="https://ui-avatars.com/api/?name=DT&background=fe2c55&color=fff">
                <button class="btn" onclick="this.style.color='#fe2c55'">❤️<span>14K</span></button>
                <button class="btn">💬<span>128</span></button>
                <button class="btn">🔗<span>Share</span></button>
            </div>

            <div class="meta">
                <div class="handle">@DesiTales_Official</div>
                <div class="desc">${title}</div>
            </div>

            <div class="progress-container"><div class="progress-bar"></div></div>
        `;

        const v = card.querySelector('video');
        const pBar = card.querySelector('.progress-bar');

        v.addEventListener('timeupdate', () => {
            pBar.style.width = (v.currentTime / v.duration) * 100 + '%';
        });

        // Click to Play/Pause (Essential for mobile)
        card.addEventListener('click', () => {
            if (v.paused) {
                v.play().catch(e => console.log("Play failed"));
            } else {
                v.pause();
            }
        });

        return card;
    }

    function startObserver() {
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play().catch(() => {
                        console.log("Waiting for user tap to play");
                    });
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.5 });
        document.querySelectorAll('.video-card').forEach(c => observer.observe(c));
    }

    window.onload = loadVideos;
</script>
</body>
</html>
