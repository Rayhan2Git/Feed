<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DesiTales Premium</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        #feed::-webkit-scrollbar { display: none; }
        .video-card { height: 100vh; width: 100vw; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; z-index: 2; background: #000; }
        .sidebar { position: absolute; right: 12px; bottom: 140px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10; }
        .btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; font-size: 28px; text-shadow: 0 2px 4px #000; }
        .btn span { font-size: 12px; margin-top: 4px; font-weight: bold; }
        .meta { position: absolute; bottom: 50px; left: 15px; right: 80px; z-index: 10; pointer-events: none; text-shadow: 2px 2px 5px #000; }
        .handle { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .loader { position: absolute; width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; z-index: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="feed"></div>

<script>
    const WORKER_URL = "https://feedscroll.rayhandox.workers.dev/?url=";
    const M3U_FILE = "playlist.m3u"; 

    async function initFeed() {
        const feed = document.getElementById('feed');
        try {
            const response = await fetch(M3U_FILE);
            const text = await response.text();
            const lines = text.split('\n');
            
            let currentTitle = "Premium Content";
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    currentTitle = line.split(',')[1] || "Premium Content";
                } else if (line.startsWith('http')) {
                    const fullUrl = WORKER_URL + encodeURIComponent(line);
                    const card = createCard(fullUrl, currentTitle);
                    feed.appendChild(card);
                }
            }
            setupScrolling();
        } catch (e) {
            feed.innerHTML = "<div style='padding:20px;text-align:center;'>Check M3U!</div>";
        }
    }

    function createCard(url, title) {
        const div = document.createElement('div');
        div.className = 'video-card';
        div.innerHTML = `
            <div class="loader"></div>
            <video loop playsinline muted src="${url}"></video>
            <div class="sidebar">
                <button class="btn" onclick="this.style.color='#fe2c55'">❤️<span>14K</span></button>
                <button class="btn">💬<span>128</span></button>
                <button class="btn">🔗<span>Share</span></button>
            </div>
            <div class="meta">
                <div class="handle">@DesiTales_Official</div>
                <div class="desc">${title}</div>
            </div>
        `;

        const v = div.querySelector('video');
        v.addEventListener('playing', () => div.querySelector('.loader').style.display = 'none');
        
        // Tap to Unmute & Play/Pause
        div.addEventListener('click', () => {
            v.muted = false; 
            v.paused ? v.play() : v.pause();
        });

        return div;
    }

    function setupScrolling() {
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                    video.currentTime = 0;
                }
            });
        }, { threshold: 0.6 });
        document.querySelectorAll('.video-card').forEach(c => observer.observe(c));
    }

    window.onload = initFeed;
</script>
</body>
</html>
