name: 🎬 DesiNetwork AutoFeed Updater

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:

    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────
      # CHECKOUT REPOSITORY
      # ─────────────────────────────
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      # ─────────────────────────────
      # SETUP PYTHON
      # ─────────────────────────────
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.11'

      # ─────────────────────────────
      # INSTALL DEPENDENCIES
      # ─────────────────────────────
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ─────────────────────────────
      # RUN FEED UPDATER
      # ─────────────────────────────
      - name: 🔄 Run feed updater
        run: |
          python update_feed.py

      # ─────────────────────────────
      # COMMIT & PUSH
      # ─────────────────────────────
      - name: 💾 Commit & push updated playlist

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u state.json

          git diff --staged --quiet || git commit -m "🎬 Auto-update playlist [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # Prevent push rejection
          git pull --rebase

          git push
