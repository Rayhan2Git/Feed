name: 🎬 DesiTales AutoFeed Updater

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:           # Also allow manual trigger from GitHub UI

permissions:
  contents: write              # Needed to push updated files back

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🔄 Run feed updater
        run: python update_feed.py

      - name: 💾 Commit & push updated playlist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u state.json
          git diff --staged --quiet || git commit -m "🎬 Auto-update playlist [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
