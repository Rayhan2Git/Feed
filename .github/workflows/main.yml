name: Build DesiFlix Pro APK
on: [push]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean and Prepare
        run: |
          rm -rf android www package-lock.json
          mkdir -p www
          cp index.html www/index.html

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Fresh Capacitor Config
        run: |
          # This creates the capacitor.config.json file automatically
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.rayhan.desiflix",
            "appName": "DesiFlix",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android Manifest
        run: |
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rayhan.desiflix">
              <application 
                  android:hardwareAccelerated="true" 
                  android:largeHeap="true" 
                  android:usesCleartextTraffic="true"
                  android:label="DesiFlix">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:theme="@style/AppTheme.NoActionBarLaunch" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
              <uses-permission android:name="android.permission.INTERNET" />
          </manifest>
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: DesiFlix-Pro-Build
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
