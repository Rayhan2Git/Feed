name: Build DesiFlix Pro APK
on: [push]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Initialize Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx cap init DesiFlix com.rayhan.desiflix --web-dir www
          npx cap add android

      - name: Configure Android Manifest
        run: |
          # This replaces the standard manifest with your Pro settings
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rayhan.desiflix">
              <application 
                  android:hardwareAccelerated="true" 
                  android:largeHeap="true" 
                  android:usesCleartextTraffic="true"
                  android:label="DesiFlix">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:theme="@style/AppTheme.NoActionBarLaunch" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          </manifest>
          EOF

      - name: Build APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: DesiFlix-Pro-Build
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
